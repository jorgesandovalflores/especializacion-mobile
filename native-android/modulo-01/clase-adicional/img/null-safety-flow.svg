<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="220" fill="#ffffff" rx="12" />

  <!-- start -->
  <rect x="30" y="80" width="150" height="60" rx="10" fill="#f5f2ff" stroke="#7f52ff" stroke-width="2" />
  <text x="105" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#5a2fd6">phone: String?</text>
  <text x="105" y="122" text-anchor="middle" font-size="11" fill="#555">puede ser null</text>

  <path d="M180 110 L230 110" stroke="#7f52ff" stroke-width="2" marker-end="url(#arrow)" />
  <text x="205" y="100" text-anchor="middle" font-size="12" fill="#5a2fd6">?.</text>

  <!-- decision -->
  <rect x="235" y="70" width="160" height="80" rx="10" fill="#fff8e6" stroke="#e0a300" stroke-width="2" />
  <text x="315" y="100" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5b00">¿phone es null?</text>
  <text x="315" y="120" text-anchor="middle" font-size="11" fill="#555">safe call:</text>
  <text x="315" y="135" text-anchor="middle" font-size="11" fill="#555">no continúa si es null</text>

  <!-- null branch -->
  <path d="M315 150 L315 175" stroke="#7f52ff" stroke-width="2" marker-end="url(#arrow)" />
  <text x="330" y="168" font-size="11" fill="#5a2fd6">null</text>
  <rect x="235" y="175" width="160" height="35" rx="8" fill="#ffffff" stroke="#bbb" stroke-width="1.5" />
  <text x="315" y="197" text-anchor="middle" font-size="11" fill="#444">?: 0  → valor Elvis</text>

  <!-- not null branch -->
  <path d="M395 110 L440 110" stroke="#7f52ff" stroke-width="2" marker-end="url(#arrow)" />
  <text x="418" y="100" text-anchor="middle" font-size="11" fill="#5a2fd6">no nulo</text>
  <rect x="445" y="80" width="180" height="60" rx="10" fill="#eefaf0" stroke="#1a7f4b" stroke-width="2" />
  <text x="535" y="105" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a7f4b">phone.length</text>
  <text x="535" y="122" text-anchor="middle" font-size="11" fill="#555">se ejecuta seguro</text>

  <path d="M625 110 L675 110" stroke="#7f52ff" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="680" y="80" width="190" height="60" rx="10" fill="#f5f2ff" stroke="#7f52ff" stroke-width="2" />
  <text x="775" y="105" text-anchor="middle" font-size="12" font-weight="bold" fill="#5a2fd6">lengthOrZero</text>
  <text x="775" y="122" text-anchor="middle" font-size="11" fill="#555">Int, nunca null</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#7f52ff" />
    </marker>
  </defs>
</svg>
