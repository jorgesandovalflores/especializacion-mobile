<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 220" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="980" height="220" fill="#ffffff" rx="12" />
  <line x1="40" y1="110" x2="940" y2="110" stroke="#7f52ff" stroke-width="4" />

  <!-- 2010/2011 -->
  <circle cx="80" cy="110" r="8" fill="#7f52ff" />
  <text x="80" y="90" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">2010–2011</text>
  <text x="80" y="140" text-anchor="middle" font-size="11" fill="#555">Nace en</text>
  <text x="80" y="154" text-anchor="middle" font-size="11" fill="#555">JetBrains</text>

  <!-- 2012 -->
  <circle cx="260" cy="110" r="8" fill="#7f52ff" />
  <text x="260" y="90" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">2012</text>
  <text x="260" y="140" text-anchor="middle" font-size="11" fill="#555">Open Source</text>
  <text x="260" y="154" text-anchor="middle" font-size="11" fill="#555">(Apache 2.0)</text>

  <!-- 2016 -->
  <circle cx="440" cy="110" r="8" fill="#7f52ff" />
  <text x="440" y="90" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">2016</text>
  <text x="440" y="140" text-anchor="middle" font-size="11" fill="#555">Kotlin 1.0</text>
  <text x="440" y="154" text-anchor="middle" font-size="11" fill="#555">(estable)</text>

  <!-- 2017 -->
  <circle cx="580" cy="110" r="8" fill="#3ddc84" />
  <text x="580" y="90" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">2017</text>
  <text x="580" y="140" text-anchor="middle" font-size="11" fill="#555">Google I/O:</text>
  <text x="580" y="154" text-anchor="middle" font-size="11" fill="#555">soporte oficial Android</text>

  <!-- 2019 -->
  <circle cx="720" cy="110" r="8" fill="#3ddc84" />
  <text x="720" y="90" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">2019</text>
  <text x="720" y="140" text-anchor="middle" font-size="11" fill="#555">Lenguaje preferido</text>
  <text x="720" y="154" text-anchor="middle" font-size="11" fill="#555">para Android</text>

  <!-- 2023+ -->
  <circle cx="900" cy="110" r="8" fill="#7f52ff" />
  <text x="900" y="90" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">2023+</text>
  <text x="900" y="140" text-anchor="middle" font-size="11" fill="#555">Compilador K2</text>
  <text x="900" y="154" text-anchor="middle" font-size="11" fill="#555">y Multiplatform</text>
</svg>
