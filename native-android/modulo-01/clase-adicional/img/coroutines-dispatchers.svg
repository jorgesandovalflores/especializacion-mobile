<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="820" height="300" fill="#ffffff" rx="12" />

  <!-- CoroutineScope box -->
  <rect x="20" y="20" width="780" height="260" rx="14" fill="#f5f2ff" stroke="#7f52ff" stroke-width="2" />
  <text x="40" y="46" font-size="15" font-weight="bold" fill="#5a2fd6">CoroutineScope (ej. viewModelScope)</text>

  <!-- Main -->
  <rect x="50" y="70" width="220" height="180" rx="10" fill="#ffffff" stroke="#3ddc84" stroke-width="2" />
  <text x="160" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a7f4b">Dispatchers.Main</text>
  <text x="160" y="122" text-anchor="middle" font-size="11" fill="#444">Hilo de UI</text>
  <text x="160" y="140" text-anchor="middle" font-size="11" fill="#444">Actualizar vistas,</text>
  <text x="160" y="156" text-anchor="middle" font-size="11" fill="#444">observar StateFlow</text>
  <text x="160" y="182" text-anchor="middle" font-size="10" fill="#888">nunca bloquear</text>
  <text x="160" y="196" text-anchor="middle" font-size="10" fill="#888">con trabajo pesado</text>

  <!-- IO -->
  <rect x="300" y="70" width="220" height="180" rx="10" fill="#ffffff" stroke="#7f52ff" stroke-width="2" />
  <text x="410" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#5a2fd6">Dispatchers.IO</text>
  <text x="410" y="122" text-anchor="middle" font-size="11" fill="#444">Pool de hilos ampliado</text>
  <text x="410" y="140" text-anchor="middle" font-size="11" fill="#444">Red, disco, base</text>
  <text x="410" y="156" text-anchor="middle" font-size="11" fill="#444">de datos</text>
  <text x="410" y="182" text-anchor="middle" font-size="10" fill="#888">operaciones que</text>
  <text x="410" y="196" text-anchor="middle" font-size="10" fill="#888">bloquean el hilo</text>

  <!-- Default -->
  <rect x="550" y="70" width="220" height="180" rx="10" fill="#ffffff" stroke="#ff6f61" stroke-width="2" />
  <text x="660" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#c23b2e">Dispatchers.Default</text>
  <text x="660" y="122" text-anchor="middle" font-size="11" fill="#444">Pool limitado a CPUs</text>
  <text x="660" y="140" text-anchor="middle" font-size="11" fill="#444">Ordenar listas grandes,</text>
  <text x="660" y="156" text-anchor="middle" font-size="11" fill="#444">parsing, cálculos</text>
  <text x="660" y="182" text-anchor="middle" font-size="10" fill="#888">trabajo intensivo</text>
  <text x="660" y="196" text-anchor="middle" font-size="10" fill="#888">de CPU</text>

  <text x="410" y="272" text-anchor="middle" font-size="11" fill="#555">withContext(Dispatchers.IO) { ... } cambia de dispatcher sin crear una coroutine nueva</text>
</svg>
