services:
    http:
        image: ${BACKEND_IMAGE}:${BACKEND_TAG}
        build:
            context: ../backend-app-taxi
            dockerfile: Dockerfile
        platform: ${HTTP_DOCKER_PLATFORM}
        container_name: ${HTTP_CONTAINER_NAME}
        restart: unless-stopped
        env_file:
            - .env
        environment:
            NODE_ENV: ${HTTP_NODE_ENV}
            NODE_DEBUG: ${HTTP_NODE_DEBUG}
            DB_HOST: ${MYSQL_CONTAINER_NAME}
            DB_PORT: 3306
            DB_USERNAME: root
            DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
            DB_NAME: ${MYSQL_DATABASE}
            DB_POOL: ${HTTP_DB_POOL}
            REDIS_HOST: ${REDIS_CONTAINER_NAME}
            REDIS_PORT: 6379
            APPLICATION_PORT: ${HTTP_APPLICATION_PORT}
            JWT_ACCESS_TTL_SEC: ${HTTP_JWT_ACCESS_TTL_SEC}
            JWT_REFRESH_TTL_SEC: ${HTTP_JWT_REFRESH_TTL_SEC}
            JWT_ACCESS_SECRET: ${HTTP_JWT_ACCESS_SECRET}
            JWT_REFRESH_SECRET: ${HTTP_JWT_REFRESH_SECRET}
            OTP_TTL_SEC: ${HTTP_OTP_TTL_SEC:-120}
            OTP_RATE_TTL_SEC: ${HTTP_OTP_RATE_TTL_SEC:-60}
            OTP_MAX_ATTEMPTS: ${HTTP_OTP_MAX_ATTEMPTS:-5}
            MENU_CACHE_TTL_SEC: ${HTTP_MENU_CACHE_TTL_SEC:-60}
            SMS_PROVIDER: ${HTTP_SMS_PROVIDER:-brevo}
            BREVO_API_KEY: ${HTTP_BREVO_API_KEY:-}
            BREVO_TEXT_SMS: ${HTTP_BREVO_TEXT_SMS:-}
            BREVO_SENDER: ${HTTP_BREVO_SENDER:-}
            LABSMOBILE_USER: ${HTTP_LABSMOBILE_USER:-}
            LABSMOBILE_API_KEY: ${HTTP_LABSMOBILE_API_KEY:-}
            LABSMOBILE_TEXT_SMS: ${HTTP_LABSMOBILE_TEXT_SMS:-}
            LABSMOBILE_SENDER: ${HTTP_LABSMOBILE_SENDER:-}
            FIREBASE_PROJECT_ID: ${HTTP_FIREBASE_PROJECT_ID:-}
            FIREBASE_CLIENT_EMAIL: ${HTTP_FIREBASE_CLIENT_EMAIL:-}
            FIREBASE_PRIVATE_KEY: ${HTTP_FIREBASE_PRIVATE_KEY:-}
            FIREBASE_STORAGE_BUCKET: ${HTTP_FIREBASE_STORAGE_BUCKET:-}
            OSRM_URL: ${HTTP_OSRM_URL:-https://router.project-osrm.org}
            OSRM_TIMEOUT_MS: ${HTTP_OSRM_TIMEOUT_MS:-8000}
            DRIVER_SEARCH_RADIUS_KM: ${HTTP_DRIVER_SEARCH_RADIUS_KM:-10}
            DRIVER_LOCATION_STALE_SEC: ${HTTP_DRIVER_LOCATION_STALE_SEC:-120}
            TRIP_REQUEST_TTL_SEC: ${HTTP_TRIP_REQUEST_TTL_SEC:-600}
            ADMIN_JWT_TTL_SEC: ${HTTP_ADMIN_JWT_TTL_SEC:-28800}
            CORS_ORIGINS: ${HTTP_CORS_ORIGINS:-}
            SEED_ADMIN_EMAIL: ${HTTP_SEED_ADMIN_EMAIL:-admin@apptaxi.pe}
            SEED_ADMIN_PASSWORD: ${HTTP_SEED_ADMIN_PASSWORD:-Admin123*}
            SEED_DRIVER_PASSWORD: ${HTTP_SEED_DRIVER_PASSWORD:-Driver123*}
        ports:
            - "${HTTP_APPLICATION_PORT}:${HTTP_APPLICATION_PORT}"
        networks:
            - internal_network

networks:
    internal_network:
        external: true
        name: ${NETWORK}
