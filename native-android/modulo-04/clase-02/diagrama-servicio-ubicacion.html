<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Servicio de ubicación</title>
<style>
  :root {
    --bg: #F4F2FA;
    --stage: #FFFFFF;
    --ink: #0F0F0F;
    --muted: #6B6B6B;
    --line: #E2DDF2;
    --primary: #7843E6;
    --primary-soft: #7843E61F;
    --ok: #2E7D32;
    --ok-soft: #E8F3E8;
    --ok-line: #B9D9BB;
    --off: #9AA0A6;
    --off-soft: #F1F1F1;
    --stop: #C62828;
    --stop-soft: #FBE9E9;
    --code: #1E1B2E;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: Inter, Roboto, system-ui, -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px;
  }
  .stage {
    width: 100%;
    max-width: 960px;
    aspect-ratio: 16 / 9;
    background: var(--stage);
    border: 1px solid var(--line);
    border-radius: 16px;
    overflow: hidden;
  }
  svg { width: 100%; height: 100%; display: block; }
  .eyebrow { font-size: 12px; letter-spacing: .32em; fill: var(--primary); font-weight: 600; }
  .title { font-size: 22px; font-weight: 700; fill: var(--ink); }
  .node rect { fill: #fff; stroke: var(--line); stroke-width: 1.5; transition: all .35s; }
  .node .name { font-size: 13px; font-weight: 700; fill: var(--ink); font-family: ui-monospace, Menlo, monospace; }
  .node .sub { font-size: 10.5px; fill: var(--muted); font-family: ui-monospace, Menlo, monospace; }
  .node { cursor: pointer; }
  .node:hover rect { stroke: var(--primary); }
  .node.on rect { stroke: var(--primary); stroke-width: 2.5; filter: drop-shadow(0 4px 10px #7843E633); }
  .node.stop rect { stroke: var(--stop); stroke-width: 2.5; }
  .edge path { fill: none; stroke: #D8D2EA; stroke-width: 2; transition: all .35s; }
  .edge text { font-size: 11px; font-weight: 600; fill: transparent; font-family: ui-monospace, Menlo, monospace; transition: fill .35s; }
  .edge.on path { stroke: var(--primary); stroke-width: 3; stroke-dasharray: 7 5; animation: flow .8s linear infinite; }
  .edge.on text { fill: var(--primary); }
  .edge.stop path { stroke: var(--stop); stroke-width: 3; stroke-dasharray: 7 5; animation: flow .8s linear infinite; }
  .edge.stop text { fill: var(--stop); }
  @keyframes flow { to { stroke-dashoffset: -24; } }
  .pill rect { transition: all .35s; }
  .pill .k { font-size: 10.5px; fill: var(--muted); font-weight: 600; letter-spacing: .08em; }
  .pill .v { font-size: 13px; font-weight: 700; }
  .pill.ok rect { fill: var(--ok-soft); stroke: var(--ok-line); }
  .pill.ok .v { fill: var(--ok); }
  .pill.off rect { fill: var(--off-soft); stroke: #DDDDDD; }
  .pill.off .v { fill: var(--off); }
  .pill.warn rect { fill: var(--stop-soft); stroke: #F0C4C4; }
  .pill.warn .v { fill: var(--stop); }
  .notif { transition: opacity .4s, transform .4s; }
  .notif.hidden { opacity: 0; transform: translateY(-8px); }
  .notif .t { font-size: 12px; font-weight: 700; fill: var(--ink); }
  .notif .b { font-size: 11px; fill: var(--muted); }
  .caption { font-size: 15px; fill: var(--ink); }
  .caption tspan.n { font-weight: 700; }
  .codebox rect { fill: var(--code); }
  .codebox text { font-size: 12px; fill: #E9E3FF; font-family: ui-monospace, Menlo, monospace; }
  .controls {
    width: 100%;
    max-width: 960px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    margin-top: 14px;
  }
  button {
    font: inherit;
    font-size: 14px;
    font-weight: 600;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--primary);
    border-radius: 999px;
    padding: 8px 16px;
    cursor: pointer;
  }
  button.primary { background: var(--primary); color: #fff; border-color: var(--primary); }
  .dots { display: flex; gap: 6px; flex-wrap: wrap; }
  .dot { width: 28px; height: 28px; padding: 0; border-radius: 50%; font-size: 12px; }
  .dot.on { background: var(--primary); color: #fff; border-color: var(--primary); }
  .hint { color: var(--muted); font-size: 13px; margin-left: auto; }
  body.capture { padding: 0; background: #fff; }
  body.capture .stage { border: 0; border-radius: 0; max-width: none; width: 960px; }
  body.capture .controls { display: none; }
</style>
</head>
<body>
<div class="stage">
<svg viewBox="0 0 960 540" role="img" aria-label="Flujo del servicio de ubicación en segundo plano">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/>
    </marker>
  </defs>

  <text class="eyebrow" x="480" y="34" text-anchor="middle">HOME · SERVICIO EN SEGUNDO PLANO</text>
  <text class="title" x="480" y="66" text-anchor="middle">La notificación vive mientras Home esté en la pila</text>

  <g class="edge" id="e-ui-vm"><path d="M212,150 L254,150" marker-end="url(#arrow)"/><text x="233" y="101" text-anchor="middle">permiso</text></g>
  <g class="edge" id="e-vm-tr"><path d="M446,150 L488,150" marker-end="url(#arrow)"/><text x="467" y="101" text-anchor="middle">start</text></g>
  <g class="edge" id="e-tr-sv"><path d="M680,150 L722,150" marker-end="url(#arrow)"/><text x="701" y="101" text-anchor="middle">intent</text></g>
  <g class="edge" id="e-sv-gps"><path d="M790,192 C790,240 640,236 600,262" marker-end="url(#arrow)"/><text x="668" y="226" text-anchor="middle">observeLocation</text></g>
  <g class="edge" id="e-sv-nt"><path d="M850,192 L850,262" marker-end="url(#arrow)"/><text x="878" y="232" text-anchor="middle">notify</text></g>

  <g class="node" id="n-ui" data-code="ui">
    <rect x="30" y="110" width="182" height="80" rx="14"/>
    <text class="name" x="121" y="144" text-anchor="middle">HomeRoute</text>
    <text class="sub" x="121" y="164" text-anchor="middle">LifecycleResumeEffect</text>
  </g>
  <g class="node" id="n-vm" data-code="vm">
    <rect x="256" y="110" width="190" height="80" rx="14"/>
    <text class="name" x="351" y="144" text-anchor="middle">HomeViewModel</text>
    <text class="sub" x="351" y="164" text-anchor="middle">init · onCleared()</text>
  </g>
  <g class="node" id="n-tr" data-code="tr">
    <rect x="490" y="110" width="190" height="80" rx="14"/>
    <text class="name" x="585" y="144" text-anchor="middle">LocationTracker</text>
    <text class="sub" x="585" y="164" text-anchor="middle">LocationTrackerImpl</text>
  </g>
  <g class="node" id="n-sv" data-code="sv">
    <rect x="724" y="110" width="206" height="80" rx="14"/>
    <text class="name" x="827" y="144" text-anchor="middle">LocationTracking</text>
    <text class="name" x="827" y="161" text-anchor="middle">Service</text>
    <text class="sub" x="827" y="179" text-anchor="middle">type = location</text>
  </g>
  <g class="node" id="n-gps" data-code="gps">
    <rect x="490" y="264" width="190" height="72" rx="14"/>
    <text class="name" x="585" y="294" text-anchor="middle">callbackFlow { }</text>
    <text class="sub" x="585" y="314" text-anchor="middle">LocationRepositoryImpl</text>
  </g>

  <g class="notif" id="notif">
    <rect x="724" y="264" width="206" height="72" rx="16" fill="#F3EFFA" stroke="#E2DDF2"/>
    <circle cx="748" cy="300" r="13" fill="#7843E6"/>
    <path d="M748,292 c-3.3,0 -6,2.6 -6,5.8 c0,4.4 6,10.2 6,10.2 s6,-5.8 6,-10.2 c0,-3.2 -2.7,-5.8 -6,-5.8z" fill="#fff"/>
    <text class="t" x="770" y="294">Compartiendo tu ubicación</text>
    <text class="b" x="770" y="313" id="notif-text">Buscando tu ubicación…</text>
  </g>

  <g class="pill" id="p-app">
    <rect x="30" y="264" width="200" height="72" rx="36"/>
    <text class="k" x="130" y="292" text-anchor="middle">APP</text>
    <text class="v" x="130" y="314" text-anchor="middle" id="p-app-v">primer plano</text>
  </g>
  <g class="pill" id="p-stack">
    <rect x="256" y="264" width="190" height="72" rx="36"/>
    <text class="k" x="351" y="292" text-anchor="middle">PILA DE NAVEGACIÓN</text>
    <text class="v" x="351" y="314" text-anchor="middle" id="p-stack-v">Home</text>
  </g>

  <g class="codebox">
    <rect x="30" y="362" width="900" height="96" rx="12"/>
    <text id="code" x="50" y="390" style="white-space: pre"></text>
  </g>

  <text class="caption" x="480" y="500" text-anchor="middle" id="caption"></text>
</svg>
</div>

<div class="controls">
  <button id="prev" aria-label="Paso anterior">‹ Anterior</button>
  <button id="play" class="primary">▶ Reproducir</button>
  <button id="next" aria-label="Paso siguiente">Siguiente ›</button>
  <div class="dots" id="dots"></div>
  <span class="hint">Toca una caja para ver su código · ← →</span>
</div>

<script>
  const CODE = {
    ui: [
      '// presentation/HomeScreen.kt (HomeRoute)',
      'LifecycleResumeEffect(Unit) { vm.onPermissionChecked(context.currentLocationPermission()) … }',
      'LaunchedEffect(tracking) { if (tracking && context.needsNotificationPermission())',
      '    notificationLauncher.launch(NOTIFICATION_PERMISSION) }'
    ],
    vm: [
      '// presentation/HomeViewModel.kt',
      'permission.map { (it as? LocationPermission.Granted)?.precise }.distinctUntilChanged()',
      '    .onEach { precise -> if (precise != null) tracker.start(precise) else tracker.stop() }',
      'override fun onCleared() { tracker.stop() }'
    ],
    tr: [
      '// domain/repository/LocationTracker.kt  ·  data/tracking/LocationTrackerImpl.kt',
      'interface LocationTracker { fun start(precise: Boolean); fun stop() }',
      'ContextCompat.startForegroundService(context, LocationTrackingService.intent(context, precise))',
      'context.stopService(Intent(context, LocationTrackingService::class.java))'
    ],
    sv: [
      '// data/tracking/LocationTrackingService.kt',
      'ServiceCompat.startForeground(this, ID, notification.build(null), FOREGROUND_SERVICE_TYPE_LOCATION)',
      'tracking = repository.observeLocation(precise).onEach(notification::update).launchIn(scope)',
      'override fun onDestroy() { scope.cancel() }   // → awaitClose → removeLocationUpdates'
    ],
    gps: [
      '// data/location/LocationRepositoryImpl.kt (clase 01, sin cambios)',
      'client.requestLocationUpdates(request, callback, Looper.getMainLooper()).await()',
      'awaitClose { client.removeLocationUpdates(callback) }',
      ''
    ]
  };

  const STEPS = [
    { on: ['n-ui', 'e-ui-vm', 'n-vm'], app: ['ok', 'primer plano'], stack: ['ok', 'Home'], notif: null, code: 'ui',
      caption: ['1', ' · Home vuelve a la pantalla y el permiso de ubicación está concedido'] },
    { on: ['n-vm', 'e-vm-tr', 'n-tr'], app: ['ok', 'primer plano'], stack: ['ok', 'Home'], notif: null, code: 'vm',
      caption: ['2', ' · El ViewModel ve Granted por primera vez y llama a tracker.start(precise)'] },
    { on: ['n-tr', 'e-tr-sv', 'n-sv'], app: ['ok', 'primer plano'], stack: ['ok', 'Home'], notif: null, code: 'tr',
      caption: ['3', ' · startForegroundService: solo se permite con la app en primer plano'] },
    { on: ['n-sv', 'e-sv-nt'], app: ['ok', 'primer plano'], stack: ['ok', 'Home'], notif: 'Buscando tu ubicación…', code: 'sv',
      caption: ['4', ' · En menos de 10 s: startForeground() publica la notificación'] },
    { on: ['n-sv', 'e-sv-gps', 'n-gps', 'e-sv-nt'], app: ['ok', 'primer plano'], stack: ['ok', 'Home'], notif: 'Precisión ±12 m · 9:41', code: 'gps',
      caption: ['5', ' · Cada posición nueva actualiza el texto de la notificación'] },
    { on: ['n-sv', 'e-sv-gps', 'n-gps', 'e-sv-nt'], app: ['off', 'segundo plano'], stack: ['ok', 'Home'], notif: 'Precisión ±8 m · 9:43', code: 'sv',
      caption: ['6', ' · Sales de la app: el mapa suelta el GPS, el servicio no'] },
    { on: ['n-vm', 'n-sv', 'e-sv-gps', 'n-gps'], app: ['ok', 'primer plano'], stack: ['ok', 'Home → Menú'], notif: 'Precisión ±8 m · 9:44', code: 'vm',
      caption: ['7', ' · Abres el menú: Home sigue en la pila, su ViewModel vive'] },
    { stop: ['n-vm', 'e-vm-tr', 'n-tr', 'e-tr-sv', 'n-sv'], labels: { 'e-vm-tr': 'stop', 'e-tr-sv': 'stopService' }, app: ['ok', 'primer plano'], stack: ['warn', 'vacía (logout)'], notif: null, code: 'vm',
      caption: ['8', ' · Cierras sesión: onCleared() → tracker.stop() → stopService()'] },
    { stop: ['n-sv', 'e-sv-gps', 'n-gps'], labels: { 'e-sv-gps': 'scope.cancel()' }, app: ['ok', 'primer plano'], stack: ['warn', 'vacía (logout)'], notif: null, code: 'sv',
      caption: ['9', ' · onDestroy cancela el scope: awaitClose apaga el GPS y la notificación se va'] }
  ];

  const $ = id => document.getElementById(id);
  const dots = $('dots');
  let step = 0;
  let timer = null;

  STEPS.forEach((_, i) => {
    const b = document.createElement('button');
    b.className = 'dot';
    b.textContent = i + 1;
    b.setAttribute('aria-label', 'Paso ' + (i + 1));
    b.onclick = () => { stopPlay(); go(i); };
    dots.appendChild(b);
  });

  function showCode(key) {
    const el = $('code');
    el.textContent = '';
    CODE[key].forEach((line, i) => {
      const t = document.createElementNS('http://www.w3.org/2000/svg', 'tspan');
      t.setAttribute('x', 50);
      t.setAttribute('dy', i === 0 ? 0 : 20);
      t.textContent = line || ' ';
      if (i === 0) t.setAttribute('fill', '#A99BD6');
      el.appendChild(t);
    });
  }

  function setPill(id, [kind, value]) {
    $(id).setAttribute('class', 'pill ' + kind);
    $(id + '-v').textContent = value;
  }

  function go(i) {
    step = (i + STEPS.length) % STEPS.length;
    const s = STEPS[step];
    document.querySelectorAll('.node, .edge').forEach(el => el.classList.remove('on', 'stop'));
    document.querySelectorAll('.edge text').forEach(t => {
      t.dataset.label ??= t.textContent;
      t.textContent = (s.labels || {})[t.parentNode.id] || t.dataset.label;
    });
    (s.on || []).forEach(id => $(id).classList.add('on'));
    (s.stop || []).forEach(id => $(id).classList.add('stop'));
    setPill('p-app', s.app);
    setPill('p-stack', s.stack);
    $('notif').classList.toggle('hidden', !s.notif);
    if (s.notif) $('notif-text').textContent = s.notif;
    showCode(s.code);
    const c = $('caption');
    c.innerHTML = '';
    const n = document.createElementNS('http://www.w3.org/2000/svg', 'tspan');
    n.setAttribute('class', 'n');
    n.textContent = s.caption[0];
    c.appendChild(n);
    c.appendChild(document.createTextNode(s.caption[1]));
    [...dots.children].forEach((d, k) => d.classList.toggle('on', k === step));
    history.replaceState(null, '', '#s=' + (step + 1) + (document.body.classList.contains('capture') ? '&capture' : ''));
  }

  function stopPlay() {
    clearInterval(timer);
    timer = null;
    $('play').textContent = '▶ Reproducir';
  }

  $('play').onclick = () => {
    if (timer) return stopPlay();
    $('play').textContent = '❚❚ Pausa';
    timer = setInterval(() => go(step + 1), 2600);
  };
  $('prev').onclick = () => { stopPlay(); go(step - 1); };
  $('next').onclick = () => { stopPlay(); go(step + 1); };
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight') { stopPlay(); go(step + 1); }
    if (e.key === 'ArrowLeft') { stopPlay(); go(step - 1); }
  });
  document.querySelectorAll('.node').forEach(n => n.addEventListener('click', () => {
    stopPlay();
    showCode(n.dataset.code);
  }));

  const params = new URLSearchParams(location.hash.slice(1));
  if (params.has('capture')) document.body.classList.add('capture');
  go((parseInt(params.get('s'), 10) || 1) - 1);
</script>
</body>
</html>
